name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed
    branches:
      - main

jobs:
  # Job 1: Detectar mudanças (Roda na Nuvem)
  detect-changes:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      professor-service: ${{ steps.filter.outputs.professor-service }}
      api-gateway: ${{ steps.filter.outputs.api-gateway }}
      grades-service: ${{ steps.filter.outputs.grades-service }}
      communication-service: ${{ steps.filter.outputs.communication-service }}
      aluno-service: ${{ steps.filter.outputs.aluno-service }}
      user-service: ${{ steps.filter.outputs.user-service }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
            professor-service:
              - 'professor-service/**'
            api-gateway:
              - 'api-gateway/**'
            grades-service:
              - 'grades-service/**'
            communication-service:
              - 'communication-service/**'
            aluno-service:
              - 'distrischool-aluno-main/**'
            user-service:
              - 'distrischool-user-service-main/user-service/**'

  # Job 2: Build Professor Service
  build-push-professor:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.professor-service == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: professor-service
          push: true
          tags: bmatox/distrischool-professor-service:latest

  # Job 3: Build API Gateway
  build-push-gateway:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.api-gateway == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: api-gateway
          push: true
          tags: bmatox/distrischool-api-gateway:latest

  # Job 4: Build Grades Service
  build-push-grades:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.grades-service == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: grades-service
          push: true
          tags: bmatox/distrischool-grades-service:latest

  # Job 5: Build Communication Service
  build-push-communication:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.communication-service == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: communication-service
          push: true
          tags: bmatox/distrischool-communication-service:latest

  # Job 6: Build Aluno Service
  build-push-aluno:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.aluno-service == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: distrischool-aluno-main
          push: true
          tags: bmatox/distrischool-aluno-service:latest

  # Job 7: Build User Service
  build-push-user:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.user-service == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: distrischool-user-service-main/user-service
          push: true
          tags: bmatox/distrischool-user-service:latest

  # Job 8: Build Frontend (Roda na Nuvem)
  build-push-frontend:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: frontend
          push: true
          tags: bmatox/distrischool-frontend:latest

  # Job 9: DEPLOY LOCAL (Roda DENTRO do seu servidor)
  deploy-local:
    runs-on: self-hosted
    needs: 
      - detect-changes
      - build-push-professor
      - build-push-gateway
      - build-push-grades
      - build-push-communication
      - build-push-aluno
      - build-push-user
      - build-push-frontend
    # Executa se pelo menos um build foi bem-sucedido
    if: |
      always() && 
      needs.detect-changes.result == 'success' &&
      (
        needs.build-push-professor.result == 'success' ||
        needs.build-push-gateway.result == 'success' ||
        needs.build-push-grades.result == 'success' ||
        needs.build-push-communication.result == 'success' ||
        needs.build-push-aluno.result == 'success' ||
        needs.build-push-user.result == 'success' ||
        needs.build-push-frontend.result == 'success'
      )
    steps:
      - name: Restart Services via Kubectl Local
        env:
          # Pegamos as variáveis de quais serviços mudaram
          UPDATE_PROFESSOR: ${{ needs.detect-changes.outputs.professor-service }}
          UPDATE_GATEWAY: ${{ needs.detect-changes.outputs.api-gateway }}
          UPDATE_GRADES: ${{ needs.detect-changes.outputs.grades-service }}
          UPDATE_COMMUNICATION: ${{ needs.detect-changes.outputs.communication-service }}
          UPDATE_ALUNO: ${{ needs.detect-changes.outputs.aluno-service }}
          UPDATE_USER: ${{ needs.detect-changes.outputs.user-service }}
          UPDATE_FRONTEND: ${{ needs.detect-changes.outputs.frontend }}
        run: |
          # Função para reiniciar o deployment correto
          restart_svc() {
            SERVICE_NAME=$1
            SHOULD_UPDATE=$2
            DEPLOYMENT=$3
          
            if [ "$SHOULD_UPDATE" == "true" ]; then
              echo "🚀 Atualizando $SERVICE_NAME..."
              # Roda direto no terminal do servidor, sem SSH
              kubectl rollout restart deployment/$DEPLOYMENT
              kubectl rollout status deployment/$DEPLOYMENT --timeout=2m
            else
              echo "⏭️ $SERVICE_NAME sem alterações."
            fi
          }

          echo "--- Iniciando Deploy Local (Self-Hosted) ---"

          restart_svc "Professor Service" "$UPDATE_PROFESSOR" "professor-tecadm-deployment"
          restart_svc "API Gateway" "$UPDATE_GATEWAY" "api-gateway-deployment"
          restart_svc "Grades Service" "$UPDATE_GRADES" "grades-deployment"
          restart_svc "Communication Service" "$UPDATE_COMMUNICATION" "communication-deployment"
          restart_svc "Aluno Service" "$UPDATE_ALUNO" "aluno-deployment"
          restart_svc "User Service" "$UPDATE_USER" "user-deployment"
          restart_svc "Frontend" "$UPDATE_FRONTEND" "frontend-deployment"