name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed
    branches:
      - main

jobs:
  # Job para detectar quais serviços foram modificados
  detect-changes:
    runs-on: ubuntu-latest
    # Só executa se o CI passou com sucesso
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      professor-service: ${{ steps.filter.outputs.professor-service }}
      api-gateway: ${{ steps.filter.outputs.api-gateway }}
      grades-service: ${{ steps.filter.outputs.grades-service }}
      communication-service: ${{ steps.filter.outputs.communication-service }}
      aluno-service: ${{ steps.filter.outputs.aluno-service }}
      user-service: ${{ steps.filter.outputs.user-service }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
            professor-service:
              - 'professor-service/**'
            api-gateway:
              - 'api-gateway/**'
            grades-service:
              - 'grades-service/**'
            communication-service:
              - 'communication-service/**'
            aluno-service:
              - 'distrischool-aluno-main/**'
            user-service:
              - 'distrischool-user-service-main/user-service/**'

  # Job para build e push de imagens Docker dos serviços backend
  build-push-backend:
    runs-on: ubuntu-latest
    needs: detect-changes
    # NOVO: Só executa se pelo menos um serviço backend mudou
    if: |
      needs.detect-changes.outputs.professor-service == 'true' ||
      needs.detect-changes.outputs.api-gateway == 'true' ||
      needs.detect-changes.outputs.grades-service == 'true' ||
      needs.detect-changes.outputs.communication-service == 'true' ||
      needs.detect-changes.outputs.aluno-service == 'true' ||
      needs.detect-changes.outputs.user-service == 'true'
    strategy:
      matrix:
        service:
          - name: professor-service
            path: professor-service
            docker_image: distrischool-professor-service
            deployment: professor-tecadm-deployment
            container: professor-tecadm-service
          - name: api-gateway
            path: api-gateway
            docker_image: distrischool-api-gateway
            deployment: api-gateway-deployment
            container: api-gateway
          - name: grades-service
            path: grades-service
            docker_image: distrischool-grades-service
            deployment: grades-deployment
            container: grades-service
          - name: communication-service
            path: communication-service
            docker_image: distrischool-communication-service
            deployment: communication-deployment
            container: communication-service
          - name: aluno-service
            path: distrischool-aluno-main
            docker_image: distrischool-aluno-service
            deployment: aluno-deployment
            container: aluno-service
          - name: user-service
            path: distrischool-user-service-main/user-service
            docker_image: distrischool-user-service
            deployment: user-deployment
            container: user-service
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        if: |
          (matrix.service.name == 'professor-service' && needs.detect-changes.outputs.professor-service == 'true') ||
          (matrix.service.name == 'api-gateway' && needs.detect-changes.outputs.api-gateway == 'true') ||
          (matrix.service.name == 'grades-service' && needs.detect-changes.outputs.grades-service == 'true') ||
          (matrix.service.name == 'communication-service' && needs.detect-changes.outputs.communication-service == 'true') ||
          (matrix.service.name == 'aluno-service' && needs.detect-changes.outputs.aluno-service == 'true') ||
          (matrix.service.name == 'user-service' && needs.detect-changes.outputs.user-service == 'true')
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Log in to Docker Hub
        if: |
          (matrix.service.name == 'professor-service' && needs.detect-changes.outputs.professor-service == 'true') ||
          (matrix.service.name == 'api-gateway' && needs.detect-changes.outputs.api-gateway == 'true') ||
          (matrix.service.name == 'grades-service' && needs.detect-changes.outputs.grades-service == 'true') ||
          (matrix.service.name == 'communication-service' && needs.detect-changes.outputs.communication-service == 'true') ||
          (matrix.service.name == 'aluno-service' && needs.detect-changes.outputs.aluno-service == 'true') ||
          (matrix.service.name == 'user-service' && needs.detect-changes.outputs.user-service == 'true')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Docker image
        if: |
          (matrix.service.name == 'professor-service' && needs.detect-changes.outputs.professor-service == 'true') ||
          (matrix.service.name == 'api-gateway' && needs.detect-changes.outputs.api-gateway == 'true') ||
          (matrix.service.name == 'grades-service' && needs.detect-changes.outputs.grades-service == 'true') ||
          (matrix.service.name == 'communication-service' && needs.detect-changes.outputs.communication-service == 'true') ||
          (matrix.service.name == 'aluno-service' && needs.detect-changes.outputs.aluno-service == 'true') ||
          (matrix.service.name == 'user-service' && needs.detect-changes.outputs.user-service == 'true')
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.path }}
          push: true
          tags: bmatox/${{ matrix.service.docker_image }}:latest

  # Job para build e push da imagem Docker do frontend
  build-push-frontend:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: frontend
          push: true
          tags: bmatox/distrischool-frontend:latest

    deploy-to-k3s:
      runs-on: ubuntu-latest
      needs: [ detect-changes, build-push-backend, build-push-frontend ]
      # Executa sempre que detectar mudanças foi sucesso e pelo menos um build passou
      if: |
        always() && 
        needs.detect-changes.result == 'success' &&
        (needs.build-push-backend.result == 'success' || needs.build-push-frontend.result == 'success')
      steps:
        - name: Setup SSH Key and Deploy
          env:
            UPDATE_PROFESSOR: ${{ needs.detect-changes.outputs.professor-service }}
            UPDATE_GATEWAY: ${{ needs.detect-changes.outputs.api-gateway }}
            UPDATE_GRADES: ${{ needs.detect-changes.outputs.grades-service }}
            UPDATE_COMMUNICATION: ${{ needs.detect-changes.outputs.communication-service }}
            UPDATE_ALUNO: ${{ needs.detect-changes.outputs.aluno-service }}
            UPDATE_USER: ${{ needs.detect-changes.outputs.user-service }}
            UPDATE_FRONTEND: ${{ needs.detect-changes.outputs.frontend }}
          run: |
           
            mkdir -p ~/.ssh/
            echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
            
            ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 
    
            cat <<EOF > deploy_script.sh
  
            restart_svc() {
              
              if [ "\$2" == "true" ]; then
                echo "🚀 Atualizando \$1..."
                kubectl rollout restart deployment/\$3
                kubectl rollout status deployment/\$3 --timeout=2m
              else
                echo "⏭️ \$1 sem alterações."
              fi
            }
            
            echo "--- Iniciando Deploy no Servidor ---"
            
            restart_svc "Professor Service" "$UPDATE_PROFESSOR" "professor-tecadm-deployment"
            restart_svc "API Gateway" "$UPDATE_GATEWAY" "api-gateway-deployment"
            restart_svc "Grades Service" "$UPDATE_GRADES" "grades-deployment"
            restart_svc "Communication Service" "$UPDATE_COMMUNICATION" "communication-deployment"
            restart_svc "Aluno Service" "$UPDATE_ALUNO" "aluno-deployment"
            restart_svc "User Service" "$UPDATE_USER" "user-deployment"
            restart_svc "Frontend" "$UPDATE_FRONTEND" "frontend-deployment"
            EOF
            
            echo "Conectando em ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}..."
            ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "bash -s" < deploy_script.sh