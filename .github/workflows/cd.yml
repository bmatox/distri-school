name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed
    branches:
      - main

jobs:
  # Job para detectar quais serviços foram modificados
  detect-changes:
    runs-on: ubuntu-latest
    # Só executa se o CI passou com sucesso
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      professor-service: ${{ steps.filter.outputs.professor-service }}
      api-gateway: ${{ steps.filter.outputs.api-gateway }}
      grades-service: ${{ steps.filter.outputs.grades-service }}
      communication-service: ${{ steps.filter.outputs.communication-service }}
      aluno-service: ${{ steps.filter.outputs.aluno-service }}
      user-service: ${{ steps.filter.outputs.user-service }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
            professor-service:
              - 'professor-service/**'
            api-gateway:
              - 'api-gateway/**'
            grades-service:
              - 'grades-service/**'
            communication-service:
              - 'communication-service/**'
            aluno-service:
              - 'distrischool-aluno-main/**'
            user-service:
              - 'distrischool-user-service-main/user-service/**'

  # Job para build e push de imagens Docker dos serviços backend
  build-push-backend:
    runs-on: ubuntu-latest
    needs: detect-changes
    strategy:
      matrix:
        service:
          - name: professor-service
            path: professor-service
            docker_image: distrischool-professor-service
            deployment: professor-tecadm-deployment
            container: professor-tecadm-service
          - name: api-gateway
            path: api-gateway
            docker_image: distrischool-api-gateway
            deployment: api-gateway-deployment
            container: api-gateway
          - name: grades-service
            path: grades-service
            docker_image: distrischool-grades-service
            deployment: grades-deployment
            container: grades-service
          - name: communication-service
            path: communication-service
            docker_image: distrischool-communication-service
            deployment: communication-deployment
            container: communication-service
          - name: aluno-service
            path: distrischool-aluno-main
            docker_image: distrischool-aluno-service
            deployment: aluno-deployment
            container: aluno-service
          - name: user-service
            path: distrischool-user-service-main/user-service
            docker_image: distrischool-user-service
            deployment: user-deployment
            container: user-service
    permissions:
      contents: read
    outputs:
      professor-service-deployed: ${{ steps.set-output.outputs.professor-service-deployed }}
      api-gateway-deployed: ${{ steps.set-output.outputs.api-gateway-deployed }}
      grades-service-deployed: ${{ steps.set-output.outputs.grades-service-deployed }}
      communication-service-deployed: ${{ steps.set-output.outputs.communication-service-deployed }}
      aluno-service-deployed: ${{ steps.set-output.outputs.aluno-service-deployed }}
      user-service-deployed: ${{ steps.set-output.outputs.user-service-deployed }}
    steps:
      - uses: actions/checkout@v4
        if: |
          (matrix.service.name == 'professor-service' && needs.detect-changes.outputs.professor-service == 'true') ||
          (matrix.service.name == 'api-gateway' && needs.detect-changes.outputs.api-gateway == 'true') ||
          (matrix.service.name == 'grades-service' && needs.detect-changes.outputs.grades-service == 'true') ||
          (matrix.service.name == 'communication-service' && needs.detect-changes.outputs.communication-service == 'true') ||
          (matrix.service.name == 'aluno-service' && needs.detect-changes.outputs.aluno-service == 'true') ||
          (matrix.service.name == 'user-service' && needs.detect-changes.outputs.user-service == 'true')
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Log in to Docker Hub
        if: |
          (matrix.service.name == 'professor-service' && needs.detect-changes.outputs.professor-service == 'true') ||
          (matrix.service.name == 'api-gateway' && needs.detect-changes.outputs.api-gateway == 'true') ||
          (matrix.service.name == 'grades-service' && needs.detect-changes.outputs.grades-service == 'true') ||
          (matrix.service.name == 'communication-service' && needs.detect-changes.outputs.communication-service == 'true') ||
          (matrix.service.name == 'aluno-service' && needs.detect-changes.outputs.aluno-service == 'true') ||
          (matrix.service.name == 'user-service' && needs.detect-changes.outputs.user-service == 'true')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Docker image
        if: |
          (matrix.service.name == 'professor-service' && needs.detect-changes.outputs.professor-service == 'true') ||
          (matrix.service.name == 'api-gateway' && needs.detect-changes.outputs.api-gateway == 'true') ||
          (matrix.service.name == 'grades-service' && needs.detect-changes.outputs.grades-service == 'true') ||
          (matrix.service.name == 'communication-service' && needs.detect-changes.outputs.communication-service == 'true') ||
          (matrix.service.name == 'aluno-service' && needs.detect-changes.outputs.aluno-service == 'true') ||
          (matrix.service.name == 'user-service' && needs.detect-changes.outputs.user-service == 'true')
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.path }}
          push: true
          tags: bmatox/${{ matrix.service.docker_image }}:latest

      - name: Set deployment output
        id: set-output
        if: |
          (matrix.service.name == 'professor-service' && needs.detect-changes.outputs.professor-service == 'true') ||
          (matrix.service.name == 'api-gateway' && needs.detect-changes.outputs.api-gateway == 'true') ||
          (matrix.service.name == 'grades-service' && needs.detect-changes.outputs.grades-service == 'true') ||
          (matrix.service.name == 'communication-service' && needs.detect-changes.outputs.communication-service == 'true') ||
          (matrix.service.name == 'aluno-service' && needs.detect-changes.outputs.aluno-service == 'true') ||
          (matrix.service.name == 'user-service' && needs.detect-changes.outputs.user-service == 'true')
        run: echo "${{ matrix.service.name }}-deployed=true" >> $GITHUB_OUTPUT

  # Job para build e push da imagem Docker do frontend
  build-push-frontend:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    permissions:
      contents: read
    outputs:
      frontend-deployed: ${{ steps.set-output.outputs.frontend-deployed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: frontend
          push: true
          tags: bmatox/distrischool-frontend:latest

      - name: Set deployment output
        id: set-output
        run: echo "frontend-deployed=true" >> $GITHUB_OUTPUT

  # Job para deploy automático no cluster K3s via SSH
  deploy-to-k3s:
    runs-on: ubuntu-latest
    needs: [detect-changes, build-push-backend, build-push-frontend]
    permissions:
      contents: read
    if: |
      always() && 
      needs.detect-changes.result == 'success' &&
      (needs.build-push-backend.result == 'success' || needs.build-push-frontend.result == 'success')
    strategy:
      matrix:
        service:
          - name: professor-service
            docker_image: distrischool-professor-service
            deployment: professor-tecadm-deployment
            container: professor-tecadm-service
          - name: api-gateway
            docker_image: distrischool-api-gateway
            deployment: api-gateway-deployment
            container: api-gateway
          - name: grades-service
            docker_image: distrischool-grades-service
            deployment: grades-deployment
            container: grades-service
          - name: communication-service
            docker_image: distrischool-communication-service
            deployment: communication-deployment
            container: communication-service
          - name: aluno-service
            docker_image: distrischool-aluno-service
            deployment: aluno-deployment
            container: aluno-service
          - name: user-service
            docker_image: distrischool-user-service
            deployment: user-deployment
            container: user-service
          - name: frontend
            docker_image: distrischool-frontend
            deployment: frontend-deployment
            container: frontend
    steps:
      - name: Deploy to K3s via SSH
        if: |
          (matrix.service.name == 'professor-service' && needs.detect-changes.outputs.professor-service == 'true') ||
          (matrix.service.name == 'api-gateway' && needs.detect-changes.outputs.api-gateway == 'true') ||
          (matrix.service.name == 'grades-service' && needs.detect-changes.outputs.grades-service == 'true') ||
          (matrix.service.name == 'communication-service' && needs.detect-changes.outputs.communication-service == 'true') ||
          (matrix.service.name == 'aluno-service' && needs.detect-changes.outputs.aluno-service == 'true') ||
          (matrix.service.name == 'user-service' && needs.detect-changes.outputs.user-service == 'true') ||
          (matrix.service.name == 'frontend' && needs.detect-changes.outputs.frontend == 'true')
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            kubectl set image deployment/${{ matrix.service.deployment }} ${{ matrix.service.container }}=bmatox/${{ matrix.service.docker_image }}:latest
            kubectl rollout status deployment/${{ matrix.service.deployment }} --timeout=5m