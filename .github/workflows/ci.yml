name: CI Pipeline

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  # Job para detectar quais serviços foram modificados
  detect-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      professor-service: ${{ steps.filter.outputs.professor-service }}
      api-gateway: ${{ steps.filter.outputs.api-gateway }}
      grades-service: ${{ steps.filter.outputs.grades-service }}
      communication-service: ${{ steps.filter.outputs.communication-service }}
      aluno-service: ${{ steps.filter.outputs.aluno-service }}
      user-service: ${{ steps.filter.outputs.user-service }}
    steps:
      - uses: actions/checkout@v4
      
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
            professor-service:
              - 'professor-service/**'
            api-gateway:
              - 'api-gateway/**'
            grades-service:
              - 'grades-service/**'
            communication-service:
              - 'communication-service/**'
            aluno-service:
              - 'distrischool-aluno-main/**'
            user-service:
              - 'distrischool-user-service-main/user-service/**'

  # Job para testar o frontend (React + Vite)
  frontend-test:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      
      - name: Run tests
        run: npm test -- --run
      
      - name: Build
        run: npm run build

  # Job para testar os microsserviços Java (Spring Boot)
  backend-test:
    runs-on: ubuntu-latest
    needs: detect-changes
    permissions:
      contents: read
    strategy:
      matrix:
        service:
          - name: professor-service
            path: professor-service
          - name: api-gateway
            path: api-gateway
          - name: grades-service
            path: grades-service
          - name: communication-service
            path: communication-service
          - name: aluno-service
            path: distrischool-aluno-main
          - name: user-service
            path: distrischool-user-service-main/user-service
    steps:
      - uses: actions/checkout@v4
        if: |
          (matrix.service.name == 'professor-service' && needs.detect-changes.outputs.professor-service == 'true') ||
          (matrix.service.name == 'api-gateway' && needs.detect-changes.outputs.api-gateway == 'true') ||
          (matrix.service.name == 'grades-service' && needs.detect-changes.outputs.grades-service == 'true') ||
          (matrix.service.name == 'communication-service' && needs.detect-changes.outputs.communication-service == 'true') ||
          (matrix.service.name == 'aluno-service' && needs.detect-changes.outputs.aluno-service == 'true') ||
          (matrix.service.name == 'user-service' && needs.detect-changes.outputs.user-service == 'true')
      
      - name: Setup JDK 17
        if: |
          (matrix.service.name == 'professor-service' && needs.detect-changes.outputs.professor-service == 'true') ||
          (matrix.service.name == 'api-gateway' && needs.detect-changes.outputs.api-gateway == 'true') ||
          (matrix.service.name == 'grades-service' && needs.detect-changes.outputs.grades-service == 'true') ||
          (matrix.service.name == 'communication-service' && needs.detect-changes.outputs.communication-service == 'true') ||
          (matrix.service.name == 'aluno-service' && needs.detect-changes.outputs.aluno-service == 'true') ||
          (matrix.service.name == 'user-service' && needs.detect-changes.outputs.user-service == 'true')
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      
      - name: Grant execute permission for mvnw
        if: |
          (matrix.service.name == 'professor-service' && needs.detect-changes.outputs.professor-service == 'true') ||
          (matrix.service.name == 'api-gateway' && needs.detect-changes.outputs.api-gateway == 'true') ||
          (matrix.service.name == 'grades-service' && needs.detect-changes.outputs.grades-service == 'true') ||
          (matrix.service.name == 'communication-service' && needs.detect-changes.outputs.communication-service == 'true') ||
          (matrix.service.name == 'aluno-service' && needs.detect-changes.outputs.aluno-service == 'true') ||
          (matrix.service.name == 'user-service' && needs.detect-changes.outputs.user-service == 'true')
        run: chmod +x ${{ matrix.service.path }}/mvnw
      
      - name: Run tests with Maven
        if: |
          (matrix.service.name == 'professor-service' && needs.detect-changes.outputs.professor-service == 'true') ||
          (matrix.service.name == 'api-gateway' && needs.detect-changes.outputs.api-gateway == 'true') ||
          (matrix.service.name == 'grades-service' && needs.detect-changes.outputs.grades-service == 'true') ||
          (matrix.service.name == 'communication-service' && needs.detect-changes.outputs.communication-service == 'true') ||
          (matrix.service.name == 'aluno-service' && needs.detect-changes.outputs.aluno-service == 'true') ||
          (matrix.service.name == 'user-service' && needs.detect-changes.outputs.user-service == 'true')
        run: cd ${{ matrix.service.path }} && ./mvnw clean test
