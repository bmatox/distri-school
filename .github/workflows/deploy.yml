name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    name: Build and Deploy ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: api-gateway
            path: api-gateway
            k8s_path: k8s-manifests/api-gateway
          - name: communication-service
            path: communication-service
            k8s_path: k8s-manifests/communication-service
          - name: grades-service
            path: grades-service
            k8s_path: k8s-manifests/grades-service
          - name: professor-service
            path: professor-service
            k8s_path: k8s-manifests/professor-service
          - name: aluno-service
            path: distrischool-aluno-main
            k8s_path: k8s-manifests/aluno-service
          - name: user-service
            path: distrischool-user-service-main/user-service
            k8s_path: k8s-manifests/user-service

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    - name: Build with Maven
      run: |
        echo "Building ${{ matrix.service.name }}..."
        cd ${{ matrix.service.path }}
        mvn clean package -DskipTests

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v4
      with:
        context: ${{ matrix.service.path }}
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service.name }}:latest
          ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service.name }}:${{ github.sha }}

    - name: Update Kubernetes Manifests (Simulation)
      run: |
        echo "Updating Kubernetes manifests for ${{ matrix.service.name }}..."
        
        # Define image name and new tag
        IMAGE_NAME="${{ secrets.DOCKER_USERNAME }}/${{ matrix.service.name }}"
        NEW_TAG="${{ github.sha }}"
        
        # Find and update yaml files in the service's k8s directory
        if [ -d "${{ matrix.service.k8s_path }}" ]; then
          find ${{ matrix.service.k8s_path }} -name "*.yaml" -print0 | xargs -0 sed -i "s|image: .*${{ matrix.service.name }}.*|image: $IMAGE_NAME:$NEW_TAG|g"
          
          echo "Updated manifests:"
          grep -r "image:" ${{ matrix.service.k8s_path }}
        else
          echo "Warning: Kubernetes manifest path ${{ matrix.service.k8s_path }} not found."
        fi

    - name: Deploy via SSH (Simulation)
      # Exemplo de como seria o deploy real via SSH
      # uses: appleboy/ssh-action@master
      # with:
      #   host: ${{ secrets.SSH_HOST }}
      #   username: ${{ secrets.SSH_USERNAME }}
      #   key: ${{ secrets.SSH_PRIVATE_KEY }}
      #   script: |
      #     kubectl apply -f k8s-manifests/${{ matrix.service.name }}/
      run: |
        echo "Simulating deployment to Kubernetes cluster..."
        echo "Connecting to production server..."
        echo "Running: kubectl apply -f ${{ matrix.service.k8s_path }}/"
        # kubectl apply -f ${{ matrix.service.k8s_path }}/
