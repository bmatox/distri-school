spring:
  datasource:
    url: jdbc:h2:mem:gradestestdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate.default_schema:
  flyway:
    enabled: false

logging:
  level:
    org.springframework: WARN
    org.hibernate: WARN
