apiVersion: v1
kind: Secret
metadata:
  name: auth-secret
type: Opaque
stringData:
  # JWT Secret for signing tokens
  # ⚠️  WARNING: This is a DEFAULT VALUE for development/testing only
  # 🔒 PRODUCTION: Generate a secure random 256-bit key using:
  #    openssl rand -base64 32
  #    or use a secret management tool (AWS Secrets Manager, HashiCorp Vault, etc.)
  # 📝 To update in production: kubectl create secret generic auth-secret --from-literal=JWT_SECRET=<your-secret> --dry-run=client -o yaml | kubectl apply -f -
  JWT_SECRET: "distrischool-jwt-secret-key-change-in-production-minimum-256-bits-for-HS256"
