apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3-management-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5672
              name: amqp
            - containerPort: 15672
              name: management
          # ─── Resource Management (RabbitMQ precisa de memória para filas) ───
          resources:
            requests:
              memory: "1Gi"      # RabbitMQ armazena mensagens em memória
              cpu: "500m"        # 0.5 cores
            limits:
              memory: "2Gi"      # Máximo 2GB
              cpu: "1500m"       # Até 1.5 cores
          # ─── Health Checks (RabbitMQ) ───
          livenessProbe:
            exec:
              command:
              - rabbitmq-diagnostics
              - -q
              - ping
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 10
          readinessProbe:
            exec:
              command:
              - rabbitmq-diagnostics
              - -q
              - check_running
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: RABBITMQ_DEFAULT_USER
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: RABBITMQ_DEFAULT_PASS
